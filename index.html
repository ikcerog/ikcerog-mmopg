<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Open World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #1a0f0a;
            color: #d4a574;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #dialog-box {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: linear-gradient(135deg, rgba(26, 15, 10, 0.95), rgba(52, 30, 18, 0.95));
            border: 3px solid #8b6f47;
            border-radius: 10px;
            padding: 20px;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(212, 165, 116, 0.3);
        }
        #dialog-box.active {
            display: block;
        }
        #npc-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #dialog-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #e8d4b8;
        }
        #dialog-continue {
            text-align: right;
            font-size: 14px;
            color: #ffd700;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(26, 15, 10, 0.8);
            border: 2px solid #8b6f47;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        #controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(26, 15, 10, 0.8);
            border: 2px solid #8b6f47;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 250px;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a0f0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #progress-bar {
            width: 300px;
            height: 30px;
            border: 2px solid #8b6f47;
            border-radius: 5px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6f47, #ffd700);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <div id="loading-text">Loading Steampunk World...</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
        <div id="ui-overlay">
            <div id="hud">
                <div>Position: <span id="player-pos">0, 0, 0</span></div>
                <div>NPCs Nearby: <span id="npc-count">0</span></div>
                <div>Press E to interact</div>
            </div>
            <div id="controls-hint">
                <strong>Controls:</strong><br>
                WASD / Arrow Keys - Move<br>
                Mouse - Look Around<br>
                E - Interact<br>
                Space - Continue Dialog<br>
                Shift - Sprint<br>
                <br>
                <strong>Gamepad:</strong><br>
                Left Stick - Move<br>
                Right Stick - Look<br>
                A/Cross - Interact
            </div>
            <div id="dialog-box">
                <div id="npc-name"></div>
                <div id="dialog-text"></div>
                <div id="dialog-continue">Press SPACE or A to continue...</div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
